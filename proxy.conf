server_tokens off;
client_max_body_size 1m;

# Rate limit zone'lari: per-IP. Auth endpointleri sıkı, API daha gevsek.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=120r/m;

server {
    listen 80;
    server_name amator.tr www.amator.tr;

    # PATH TRAVERSAL: block encoded dots, null bytes, double encoding
    if ($request_uri ~* "(\.\.|%2e%2e|%252e|%00|%0a|%0d)") {
        return 403;
    }

    # BLOCK: dot files
    location ~ /\. {
        return 404;
    }

    location /api/ {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

server {
    listen 80;
    server_name cagri.amator.tr;

    # PATH TRAVERSAL: block encoded dots, null bytes, double encoding
    if ($request_uri ~* "(\.\.|%2e%2e|%252e|%00|%0a|%0d)") {
        return 403;
    }

    # BLOCK: dot files
    location ~ /\. {
        return 404;
    }

    # BLOCK: sensitive paths
    location ~* ^/(data|migrations|scripts|node_modules|\.env|package\.json|Dockerfile|docker-compose) {
        return 404;
    }

    # Auth endpointlerinde dar rate-limit (login/register/reset bombalama).
    location ~* ^/(login|register|sifre-sifirla|verify-resend|verify-code|setup) {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    location / {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

server {
    listen 80;
    server_name dosyalar.amator.tr;

    # 100 MB — Cloudflare free plan body sinirinin altinda.
    client_max_body_size 100m;

    if ($request_uri ~* "(\.\.|%2e%2e|%252e|%00|%0a|%0d)") {
        return 403;
    }

    location ~ /\. {
        return 404;
    }

    # Admin upload + UI — app'e iletilir (auth_zone rate-limit, sıkı)
    location /api/dosyalar/ {
        limit_req zone=auth_zone burst=20 nodelay;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /yukle {
        limit_req zone=api_zone burst=20 nodelay;
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $remote_addr;
    }

    # Public mirror — autoindex + static download (web container)
    location / {
        proxy_pass http://web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
