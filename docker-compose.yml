services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
      # Admin yayinlama: pipeline kaynagi, ciktisi, build cache, .git ve
      # auto-emit edilen valid-slugs dosyasi. nginx web servisi ./public'i
      # readonly mount ediyor — ayri mount, ayri mode.
      - ./content:/app/content
      - ./public:/app/public
      - ./scripts:/app/scripts
      - ./.git:/app/.git
      - ./src/valid-slugs.js:/app/src/valid-slugs.js
      # SSH deploy key (chmod 600 host'ta). Yoksa container yuklenir ama
      # publish push'unda gecersiz key hatasi gorur — admin akisi calismaz.
      - ${DEPLOY_KEY_PATH:-/dev/null}:/root/.ssh/deploy_key:ro
    environment:
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Admin Publish}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-admin@amator.tr}
      GIT_COMMITTER_NAME: ${GIT_AUTHOR_NAME:-Admin Publish}
      GIT_COMMITTER_EMAIL: ${GIT_AUTHOR_EMAIL:-admin@amator.tr}
      GIT_SSH_COMMAND: "ssh -i /root/.ssh/deploy_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
      REPO_ROOT: /app
    ports:
      - "4541:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "4540:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 3

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy

  backup:
    build: .
    restart: "no"
    volumes:
      - ./data:/app/data
    entrypoint: ["node", "scripts/backup.js"]
    profiles:
      - tools
