server_tokens off;
client_max_body_size 1m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # PATH TRAVERSAL: block encoded dots, null bytes, double encoding
    if ($request_uri ~* "(\.\.|%2e%2e|%252e|%00|%0a|%0d)") {
        return 403;
    }

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 256;

    # SSI: statik HTML sayfalari _includes/footer.html'i tek kaynaktan ceksin
    ssi on;
    ssi_types text/html;

    # _includes ic kullanim — disaridan dogrudan erisilemesin (SSI subrequest calismaya devam eder)
    location ^~ /_includes/ {
        internal;
    }

    # BLOCK: dot files (.env, .git, .gitignore, .htaccess etc.)
    location ~ /\. {
        return 404;
    }

    # BLOCK: sensitive files
    location ~* (\.sql|\.db|\.sh|\.log|Dockerfile|docker-compose|package\.json|package-lock|node_modules|\.env) {
        return 404;
    }

    # cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # try file, then directory, then 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: edge'de Cloudflare zaten gondersinde ayrica origin'de set edelim ki
    # CF tunnel devre disi kalsa bile tarayici HTTPS'i hatirlasin.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}

# dosyalar.amator.tr — admin upload servisinin public mirror'i.
# / + /<kategori>/ → autoindex HTML (inline, render edilir).
# /<kategori>/<file> → resim ise inline, diger her sey attachment.
# Yasakli uzantilar 403 (defense-in-depth: zaten allowlist disindalar).
server {
    listen 80;
    server_name dosyalar.amator.tr;
    root /usr/share/nginx/dosyalar;
    charset utf-8;

    # PATH TRAVERSAL
    if ($request_uri ~* "(\.\.|%2e%2e|%252e|%00|%0a|%0d)") {
        return 403;
    }

    # Yasakli uzantilar — diskte zaten olmamali ama defense-in-depth
    location ~* \.(svg|html?|js|jsx|php|sh|bat|cmd|ps1|vbs|hta|cgi|asp|jsp)$ {
        return 403;
    }

    # Dot files
    location ~ /\. {
        return 404;
    }

    # Resimler — inline servis (preview icin)
    location ~* ^/img/.*\.(png|jpe?g|webp|gif)$ {
        add_header Content-Disposition "inline" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        expires 7d;
    }

    # Indirilebilir uzantilar — Content-Disposition: attachment zorla
    location ~* \.(pdf|mp3|wav|ogg|m4a|mp4|webm|mov|mkv|zip|tar|gz|7z|rar|exe|msi|dmg|deb|rpm|doc|docx|xls|xlsx|txt|csv)$ {
        add_header Content-Disposition "attachment" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Default — autoindex (dizin listesi). HTML render edilir, attachment YOK.
    location / {
        autoindex on;
        autoindex_format html;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
